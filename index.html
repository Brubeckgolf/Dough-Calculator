<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Dough Calculator</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background:#111;
    color:#eee;
    padding:16px;
    margin:0;
    font-size:20px;
    line-height:1.5;
  }

  h1 {
    font-size:1.6rem;
    text-align:center;
    margin-bottom:20px;
  }

  /* FULL-WIDTH LABEL FIX */
  label {
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    font-size:1.4rem;
    font-weight:600;
    margin:24px 0 8px 0;
  }

  /* Ensure everything inside the label also fills width */
  label > * {
    width:100% !important;
    display:block;
  }

  /* Input rows with + / - buttons */
  .input-row {
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:8px;
  }

  .input-row input {
    flex:1;
    font-size:1.4rem;
    padding:14px;
    text-align:center;
    border-radius:10px;
    border:1px solid #444;
    background:#000;
    color:#eee;
  }

  .pm {
    width:52px;
    height:52px;
    font-size:1.8rem;
    border-radius:12px;
    border:none;
    background:#333;
    color:#eee;
  }

  select {
    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #444;
    background:#000;
    color:#eee;
    font-size:1.2rem;
  }

  button.calculate {
    width:100%;
    padding:16px;
    margin-top:24px;
    border:none;
    border-radius:12px;
    background:#5bb36a;
    color:#000;
    font-size:1.3rem;
    font-weight:bold;
  }

  /* Buttons that open panels */
  .open-panel-btn {
    width:100%;
    padding:18px;
    margin-top:16px;
    border-radius:12px;
    border:none;
    background:#222;
    color:#eee;
    font-size:1.3rem;
    text-align:left;
  }

  /* Full-screen slide-up panels */
  .panel {
    position:fixed;
    left:0;
    right:0;
    bottom:-100%;
    height:100%;
    background:#111;
    padding:28px;
    border-radius:20px 20px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,0.6);
    transition:bottom 0.35s ease;
    overflow-y:auto;
    z-index:999;
  }

  .panel.open {
    bottom:0;
  }

  .panel-close {
    text-align:center;
    margin-bottom:20px;
    font-size:1.3rem;
    opacity:0.7;
    cursor:pointer;
  }

  .panel h2 {
    text-align:center;
    font-size:1.8rem;
    margin-bottom:20px;
  }

  /* Ingredient table */
  table {
    width:100%;
    border-collapse:collapse;
    font-size:1.4rem;
  }

  th, td {
    padding:16px 10px;
    border-bottom:1px solid #333;
  }

  th {
    background:#333;
  }
</style>
</head>

<body>

<h1>Pizza Dough Hydration Calculator</h1>

<!-- INPUTS -->
<div>
  <label>Number of pizzas
    <div class="input-row">
      <button class="pm" onclick="adjust('numPizzas', -1)">−</button>
      <input type="number" id="numPizzas" value="4">
      <button class="pm" onclick="adjust('numPizzas', 1)">+</button>
    </div>
  </label>

  <label>Dough ball weight (g)
    <div class="input-row">
      <button class="pm" onclick="adjust('ballWeight', -10)">−</button>
      <input type="number" id="ballWeight" value="250">
      <button class="pm" onclick="adjust('ballWeight', 10)">+</button>
    </div>
  </label>

  <label>Hydration (%)
    <div class="input-row">
      <button class="pm" onclick="adjust('hydration', -1)">−</button>
      <input type="number" id="hydration' value="65">
      <button class="pm" onclick="adjust('hydration', 1)">+</button>
    </div>
  </label>

  <label>Salt input type
    <select id="saltMode">
      <option value="percent" selected>Percentage of flour</option>
      <option value="weight">Fixed grams</option>
    </select>
  </label>

  <label>Salt (%) or g
    <div class="input-row">
      <button class="pm" onclick="adjust('saltValue', -0.1)">−</button>
      <input type="number" id="saltValue" value="2.2">
      <button class="pm" onclick="adjust('saltValue', 0.1)">+</button>
    </div>
  </label>

  <label>Yeast input type
    <select id="yeastMode">
      <option value="percent" selected>Percentage of flour</option>
      <option value="weight">Fixed grams</option>
    </select>
  </label>

  <label>Yeast (%) or g
    <div class="input-row">
      <button class="pm" onclick="adjust('yeastValue', -0.1)">−</button>
      <input type="number" id="yeastValue" value="0.2">
      <button class="pm" onclick="adjust('yeastValue', 0.1)">+</button>
    </div>
  </label>

  <label>Poolish flour % of total flour
    <div class="input-row">
      <button class="pm" onclick="adjust('poolishPct', -1)">−</button>
      <input type="number" id="poolishPct" value="30">
      <button class="pm" onclick="adjust('poolishPct', 1)">+</button>
    </div>
  </label>

  <button class="calculate" onclick="compute()">Calculate</button>
</div>

<!-- PANEL BUTTONS -->
<button class="open-panel-btn" onclick="openPanel('panelTotal')">Total Dough</button>
<button class="open-panel-btn" onclick="openPanel('panelPoolish')">Poolish Starter</button>
<button class="open-panel-btn" onclick="openPanel('panelFinal')">Final Mix</button>

<!-- PANELS -->
<div id="panelTotal" class="panel">
  <div class="panel-close" onclick="closePanel('panelTotal')">Close ✕</div>
  <h2>Total Dough</h2>
  <table>
    <tr><th>Ingredient</th><th>Amount</th></tr>
    <tr><td>Total dough weight</td><td id="totalDough">—</td></tr>
    <tr><td>Flour</td><td id="totalFlour">—</td></tr>
    <tr><td>Water</td><td id="totalWater">—</td></tr>
    <tr><td>Salt</td><td id="totalSalt">—</td></tr>
    <tr><td>Yeast</td><td id="totalYeast">—</td></tr>
    <tr><td>Honey</td><td id="totalHoney">—</td></tr>
  </table>
</div>

<div id="panelPoolish" class="panel">
  <div class="panel-close" onclick="closePanel('panelPoolish')">Close ✕</div>
  <h2>Poolish Starter</h2>
  <table>
    <tr><th>Ingredient</th><th>Amount</th></tr>
    <tr><td>Flour</td><td id="poolishFlour">—</td></tr>
    <tr><td>Water</td><td id="poolishWater">—</td></tr>
    <tr><td>Yeast</td><td id="poolishYeast">—</td></tr>
    <tr><td>Honey</td><td id="poolishHoney">—</td></tr>
  </table>
</div>

<div id="panelFinal" class="panel">
  <div class="panel-close" onclick="closePanel('panelFinal')">Close ✕</div>
  <h2>Final Mix</h2>
  <table>
    <tr><th>Ingredient</th><th>Amount</th></tr>
    <tr><td>Flour</td><td id="finalFlour">—</td></tr>
    <tr><td>Water</td><td id="finalWater">—</td></tr>
    <tr><td>Salt</td><td id="finalSalt">—</td></tr>
    <tr><td>Yeast</td><td>0 g</td></tr>
    <tr><td>Honey</td><td>0 g</td></tr>
  </table>
</div>

<script>
function openPanel(id){
  document.getElementById(id).classList.add("open");
}

function closePanel(id){
  document.getElementById(id).classList.remove("open");
}

function adjust(id, delta){
  const el = document.getElementById(id);
  let v = Number(el.value);
  v += delta;
  if(v < 0) v = 0;
  el.value = v;
  compute();
}

function g(x){return Math.round(x);}

function compute(){
  const numPizzas = +document.getElementById('numPizzas').value;
  const ballWeight = +document.getElementById('ballWeight').value;
  const hydration = +document.getElementById('hydration').value/100;
  const poolishPct = +document.getElementById('poolishPct').value/100;

  const saltMode = document.getElementById('saltMode').value;
  const saltValue = +document.getElementById('saltValue').value;
  const yeastMode = document.getElementById('yeastMode').value;
  const yeastValue = +document.getElementById('yeastValue').value;

  const totalDough = numPizzas*ballWeight;
  let totalFlour = totalDough/(1+hydration);
  let totalWater = hydration*totalFlour;

  let totalSalt = (saltMode==="percent") ? (saltValue/100)*totalFlour : saltValue;
  let totalYeast = (yeastMode==="percent") ? (yeastValue/100)*totalFlour : yeastValue;
  let totalHoney = totalYeast;

  const adjustedTotal = totalFlour+totalWater+totalSalt+totalYeast;
  const scale = totalDough/adjustedTotal;
  totalFlour*=scale; totalWater*=scale; totalSalt*=scale; totalYeast*=scale; totalHoney*=scale;

  const poolishFlour = totalFlour*poolishPct;
  const poolishWater = poolishFlour;
  const poolishYeast = totalYeast;
  const poolishHoney = totalHoney;

  const finalFlour = totalFlour - poolishFlour;
  const finalWater = totalWater - poolishWater;
  const finalSalt = totalSalt;

  document.getElementById('totalDough').textContent=g(totalDough)+' g';
  document.getElementById('totalFlour').textContent=g(totalFlour)+' g';
  document.getElementById('totalWater').textContent=g(totalWater)+' g';
  document.getElementById('totalSalt').textContent=g(totalSalt)+' g';
  document.getElementById('totalYeast').textContent=g(totalYeast)+' g';
  document.getElementById('totalHoney').textContent=g(totalHoney)+' g';

  document.getElementById('poolishFlour').textContent=g(poolishFlour)+' g';
  document.getElementById('poolishWater').textContent=g(poolishWater)+' g';
  document.getElementById('poolishYeast').textContent=g(poolishYeast)+' g';
  document.getElementById('poolishHoney').textContent=g(poolishHoney)+' g';

  document.getElementById('finalFlour').textContent=g(finalFlour)+' g';
  document.getElementById('finalWater').textContent=g(finalWater)+' g';
  document.getElementById('finalSalt').textContent=g(finalSalt)+' g';
}
</script>

</body>
</html>
